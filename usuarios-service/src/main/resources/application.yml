server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: usuarios-service
  datasource:
    url: ${ORACLE_URL:}
    username: ${ORACLE_USERNAME:}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

oracle:
  wallet-location: ${ORACLE_WALLET_LOCATION:}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

respawncherry:
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:4200}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      name: ${BOOTSTRAP_ADMIN_NAME:Respawn Cherry Admin}
      correo: ${BOOTSTRAP_ADMIN_EMAIL:admin@respawncherry.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
